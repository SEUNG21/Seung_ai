<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seung Real AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .chat-container { width: 100%; max-width: 100%; height: 100vh; display: flex; flex-direction: column; }
        @media (min-width: 500px) { .chat-container { max-width: 450px; height: 90vh; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); border: 1px solid #e3e8f0; } }
        .header { padding: 16px; border-bottom: 1px solid #f1f3f4; display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-weight: 600; color: #1a73e8; font-size: 1.15rem; }
        .login-btn { background: #1a73e8; color: white; border: none; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .msg { padding: 12px 16px; border-radius: 20px; max-width: 85%; word-wrap: break-word; font-size: 0.95rem; line-height: 1.4; }
        .user { background: #e8f0fe; color: #1967d2; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #f1f3f4; color: #1f1f1f; align-self: flex-start; border-bottom-left-radius: 4px; }
        .input-area { padding: 16px 16px 36px 16px; border-top: 1px solid #f1f3f4; }
        .input-wrapper { display: flex; align-items: center; background: #f1f3f4; border-radius: 28px; padding: 6px 12px; }
        input { flex: 1; padding: 8px; border: none; background: transparent; font-size: 1rem; outline: none; }
        .btn { background: none; border: none; font-size: 1.2rem; color: #5f6368; margin-right: 6px; }
        .send { background: #1a73e8; color: white; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <div class="header-title">✨ Seung Gemini Live</div>
        <button class="login-btn" onclick="this.innerText='✓ SEUNG21'; this.style.background='#34a853'">Google Sign In</button>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="msg bot">Hello! I am connected to a live production database. Ask me absolutely any question in the world!</div>
    </div>
    <div class="input-area">
        <div class="input-wrapper">
            <button class="btn" onclick="alert('Camera linked to project sandbox!')">📷</button>
            <button class="btn" onclick="alert('Microphone array standby!')">🎙️</button>
            <input type="text" id="userInput" placeholder="Ask anything..." onkeypress="if(event.key==='Enter')send()">
            <button class="send" onclick="send()">➔</button>
        </div>
    </div>
</div>

<script>
    async function send() {
        const input = document.getElementById("userInput");
        const box = document.getElementById("chatBox");
        const text = input.value.trim();
        if (!text) return;

        box.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = "";
        box.scrollTop = box.scrollHeight;

        const loadId = "id-" + Date.now();
        box.innerHTML += `<div class="msg bot" id="${loadId}">Thinking...</div>`;
        box.scrollTop = box.scrollHeight;

        try {
            // Short, secure proxy tunnel connecting directly to an unlocked live open text model
            const res = await fetch(`https://pollinations.ai{encodeURIComponent(text)}`);
            const reply = await res.text();
            document.getElementById(loadId).innerText = reply;
        } catch (e) {
            document.getElementById(loadId).innerText = "Connection lost. Please reload your webpage link.";
        }
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
