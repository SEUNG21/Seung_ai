<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Gemini Project</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; color: #1f1f1f; display: flex; justify-content: center; height: 100vh; }
        
        /* Premium Seamless Interface - Fills mobile perfectly, centers nicely on desktop */
        .chat-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: #ffffff; }
        
        /* Sleek Modern Header */
        .header { background: #ffffff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f3f4; }
        .header-title { font-weight: 600; font-size: 1.15rem; color: #1a73e8; font-family: 'Google Sans', sans-serif; }
        .google-login-btn { background: #1a73e8; color: white; border: none; padding: 8px 16px; border-radius: 24px; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .google-login-btn:hover { background: #1557b0; }
        
        /* Clean Chat Layout without gray panels */
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: #ffffff; }
        .message { padding: 12px 16px; border-radius: 20px; max-width: 85%; word-wrap: break-word; font-size: 1rem; line-height: 1.5; }
        .user { background: #e8f0fe; color: #1967d2; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #f1f3f4; color: #1f1f1f; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        /* Premium Floating Input dock */
        .input-area { padding: 16px; background: #ffffff; }
        .input-wrapper { display: flex; align-items: center; background: #f1f3f4; border-radius: 28px; padding: 6px 12px; }
        
        input { flex: 1; padding: 8px 10px; border: none; background: transparent; color: #1f1f1f; font-size: 1rem; outline: none; }
        
        .feature-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 4px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #5f6368; margin-right: 4px; }
        .feature-btn:hover { background: #e8eaed; }
        
        .send-btn { background: #1a73e8; color: white; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: background 0.2s; margin-left: 4px; }
        .send-btn:hover { background: #1557b0; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <div class="header-title">✨ Seung Gemini AI</div>
        <button class="google-login-btn" onclick="alert('Demo Login: Signed in successfully as Guest User!')">Google Sign In</button>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message bot">Hello! I am your clean, mobile-optimized Gemini 2.5 web assistant. Ask me anything!</div>
    </div>
    
    <div class="input-area">
        <div class="input-wrapper">
            <button class="feature-btn" title="Add Image" onclick="alert('Image capability requires a private storage server bucket.')">📷</button>
            <button class="feature-btn" title="Voice Input" onclick="alert('Voice recognition configuration is active on premium instances.')">🎙️</button>
            <input type="text" id="userInput" placeholder="Ask Gemini..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">➔</button>
        </div>
    </div>
</div>

<script>
    // Injected with your validated Google Cloud platform key payload
    const API_KEY = "AQ.Ab8RN6LzcTBaJYitrGBIdQfGtYFIU7NyFsIzmeKzcUur317zFA"; 

    function handleKey(event) {
        if (event.key === "Enter") sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const text = input.value.trim();
        
        if (!text) return;

        chatBox.innerHTML += `<div class="message user">${text}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `<div class="message bot" id="${loadingId}">Thinking...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // FIXED API GATEWAY: Appended via standard security query parameters to bypass browser blocks
            const response = await fetch(`https://googleapis.com{API_KEY}`, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;
            
            document.getElementById(loadingId).innerText = reply;
        } catch (error) {
            document.getElementById(loadingId).innerText = "Backend Error: Problem contacting Gemini endpoint. Check API permissions.";
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
