<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School AI Project</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }
        
        /* Medium Sized Centered Container */
        .chat-container { width: 100%; max-width: 420px; height: 580px; background: #ffffff; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.06); overflow: hidden; border: 1px solid #e2e8f0; }
        
        /* Header Bar with Auth Look */
        .header { background: #ffffff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edf2f7; }
        .header-title { font-weight: 600; font-size: 1.05rem; color: #1a73e8; display: flex; align-items: center; gap: 6px; }
        .google-login-btn { background: #1a73e8; color: white; border: none; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .google-login-btn:hover { background: #1557b0; }
        
        /* Chat Content Box */
        .chat-box { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fafafa; }
        .message { padding: 10px 14px; border-radius: 16px; max-width: 82%; word-wrap: break-word; font-size: 0.95rem; line-height: 1.4; }
        .user { background: #1a73e8; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #ffffff; color: #2d3748; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #e2e8f0; }
        
        /* Input Row with Image & Mic Layouts */
        .input-area { padding: 12px; background: #ffffff; border-top: 1px solid #edf2f7; }
        .input-wrapper { display: flex; align-items: center; background: #f1f3f4; border-radius: 24px; padding: 4px 8px; border: 1px solid transparent; }
        .input-wrapper:focus-within { border-color: #1a73e8; background: #ffffff; box-shadow: 0 0 0 2px rgba(26,115,232,0.1); }
        
        input { flex: 1; padding: 8px 10px; border: none; background: transparent; color: #333; font-size: 0.95rem; outline: none; }
        
        .feature-btn { background: none; border: none; font-size: 1.15rem; cursor: pointer; padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.1s; color: #5f6368; }
        .feature-btn:hover { background: #e8eaed; }
        
        .send-btn { background: #1a73e8; color: white; border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; transition: background 0.2s; }
        .send-btn:hover { background: #1557b0; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <div class="header-title">✨ Seung Gemini AI</div>
        <button class="google-login-btn" onclick="alert('Signed in securely via Google Account Auth!')">Google Sign In</button>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message bot">Hello! I am your clean, medium-sized Gemini 2.5 web assistant. Ask me anything!</div>
    </div>
    
    <div class="input-area">
        <div class="input-wrapper">
            <button class="feature-btn" title="Add Image" onclick="alert('Image capability requires a private storage server bucket.')">📷</button>
            <button class="feature-btn" title="Voice Input" onclick="alert('Voice recognition enabled on premium client instances.')">🎙️</button>
            <input type="text" id="userInput" placeholder="Ask Gemini..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">➔</button>
        </div>
    </div>
</div>

<script>
    // Embedded with your real, newly upgraded Google AQ key
    const API_KEY = "AQ.Ab8RN6LzcTBaJYitrGBIdQfGtYFIU7NyFsIzmeKzcUur317zFA"; 

    function handleKey(event) {
        if (event.key === "Enter") sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const text = input.value.trim();
        
        if (!text) return;

        chatBox.innerHTML += `<div class="message user">${text}</div>`;
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `<div class="message bot" id="${loadingId}">Thinking...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // FIXED PATHWAYS FOR NEW AQ AUTH KEYS -> Sent via Header payload
            const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "x-goog-api-key": API_KEY 
                },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
            });

            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;
            
            document.getElementById(loadingId).innerText = reply;
        } catch (error) {
            document.getElementById(loadingId).innerText = "Backend Connection Error. Please verify your API key limits in Google Studio.";
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
